<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Survey</title>

<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Lora', serif;
    text-align: center;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    background-size: 300% 300%;
    animation: gradientBG 8s ease infinite;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

small_text {
    font-family: 'Lora', serif;
    text-align: center;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    background-size: 300% 300%;
    animation: gradientBG 8s ease infinite;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-size: 2px;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    max-width: 500px;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    animation: fadeIn 0.8s ease-in-out;
}

.hidden {
    display: none;
}

button {
    font-size: 16px;
    padding: 10px 15px;
    margin: 8px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    transition: transform 0.2s ease, background 0.2s ease;
}

button:hover {
    transform: scale(1.05);
}

.yes-button {
    background-color: #ff4d6d;
    color: white;
}

.yes-button:hover {
    background-color: #e03e5a;
}

.no-button {
    background-color: #888;
    color: white;
}

input {
    padding: 8px;
    width: 80%;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

#main-gif {
    margin-top: 15px;
    transition: opacity 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<h1 id="survey-title">Important Survey 📊</h1>

<!-- NAME INPUT -->
<div id="name-container" class="container">
    <h2>Before we begin...</h2>
    <p>Please enter your name</p>
    <input type="text" id="participant-name" placeholder="Your name here">
    <p style="font-size: 12px;">(LAST NAME FIRST NAME)</p>
    <p style="font-size: 12px;">(No commas, periods etc.)</p>
    <button onclick="startSurvey()">Start</button>
</div>

<!-- SURVEY -->
<div id="survey-container" class="container hidden">
    <p id="question"></p>
    <div id="choices-container"></div>
</div>

<!-- VALENTINE -->
<div id="valentine-container" class="container hidden">
    <h1>Will you be my Valentine? 💖</h1>

    <img id="main-gif" src="intro.gif" width="300" alt="Valentine GIF">

    <p id="flavor-text">Think carefully before answering! 🤔</p>

    <button class="yes-button" onclick="handleYesClick()">Yes</button>
    <button class="no-button" onclick="handleNoClick()">No</button>
</div>

<audio id="click-sound" src="click.wav"></audio>

<script>
let participantName = "";
let surveyStep = 0;
let noClickCount = 0;

/* 🔥 CHANGE THIS NAME */
const chosenNames = ["cabanag archelle blessy"]; 

const surveyData = [
{ question: "Pick your 2026 coping mechanism:",
  choices: ["Gym arc 💪", "Bedrotting but istitik 🛌", "Digital detox era 📵", "Starting 4 side hustles 💻", "None of the Above (really?)"] },

{ question: "What’s your algorithm feeding you lately?",
  choices: ["Gym edits 🗿", "Relationship memes 🥹", "Political chaos 📰", "Cat videos 🐱", "6 7", "None of the Above (again?)"] },

{ question: "Which arc are you in right now?",
  choices: ["Villain arc 😈", "Healing arc 🌿", "Locked in 🔒", "Redemption Arc 🐦‍🔥", "Just surviving 💀"] },

{ question: "What’s your toxic trait?",
  choices: ["Overthinking 🧠", "Replying late ⏳", "Accidental ghosting 👻", "Caring too much 🤍"] },

{ question: "If you could reset 2026 so far...",
  choices: ["Yes immediately 🔄", "Only if memories stay 🧩", "No, I need my character development 📈", "I refuse to elaborate 😶"] },

{ question: "Final Question... are you ready?",
  choices: ["Yes ✅", "No ❌", "Maybe 🤔", "What’s happening? 😳"] }
];

const messages = [
"Are you sure? 🥺",
"Please reconsider... 😢",
"You’re breaking my heart... 💔",
"What if I cry? 😭",
"Last chance... 🫣",
"Okay... dramatic. 😒",
"Still no? 😔",
"Wow. 😐",
"This is getting awkward.",
"Fine. I respect it. 😌"
];

function playClickSound() {
    const sound = document.getElementById("click-sound");
    sound.currentTime = 0;
    sound.play();
}

function startSurvey() {
    const input = document.getElementById("participant-name").value.trim();
    if (input === "") {
        alert("Please enter your name first! (LAST NAME FIRST NAME MIDDLE NAME) (No commas, periods etc.)");
        return;
    }

    participantName = input;
    document.getElementById("name-container").classList.add("hidden");
    document.getElementById("survey-container").classList.remove("hidden");

    nextQuestion();
}

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function normalizeName(name) {
    return name.trim().toLowerCase().replace(/\s+/g, " ");
}

function isNameValid(input, names) {
    const normalizedInput = normalizeName(input);
    return names.some(name => {
        const normalizedName = normalizeName(name);
        // Allow exact match or partial match
        return normalizedInput === normalizedName || normalizedName.includes(normalizedInput);
    });
}

function nextQuestion() {
    playClickSound();

    if (surveyStep < surveyData.length) {
        const questionText = document.getElementById("question");
        const choicesContainer = document.getElementById("choices-container");

        questionText.textContent = surveyData[surveyStep].question;
        choicesContainer.innerHTML = "";

        let shuffledChoices = [...surveyData[surveyStep].choices];
        shuffleArray(shuffledChoices);

        shuffledChoices.forEach(choice => {
            const button = document.createElement("button");
            button.textContent = choice;
            button.onclick = nextQuestion;
            choicesContainer.appendChild(button);
        });

        surveyStep++;
    } else {
        document.getElementById("survey-container").classList.add("hidden");

        localStorage.setItem("participantName", participantName);

        if (isNameValid(participantName, chosenNames)) {
            document.getElementById("survey-title").textContent = "SURPRISE!";
            document.getElementById("valentine-container").classList.remove("hidden");
        } else {
            window.location.href = "thankyou.html";
        }
    }
}

function handleNoClick() {
    playClickSound();

    const noButton = document.querySelector(".no-button");
    const flavorText = document.getElementById("flavor-text");

    if (noClickCount < messages.length) {
        flavorText.textContent = messages[noClickCount];
        noButton.style.transform = `scale(${1 - noClickCount * 0.1})`;
    } else {
        noButton.style.display = "none";
        flavorText.textContent = "Okay fine, you win 😌";
    }

    noClickCount++;
}

function handleYesClick() {
    playClickSound();
    const gif = document.getElementById("main-gif");
    gif.src = "yes.gif";
    document.getElementById("flavor-text").textContent = "YAY! You made my day ❤️";
    setTimeout(() => {
        window.location.href = "yes_page.html";
    }, 2000);
}
</script>

</body>
</html>
