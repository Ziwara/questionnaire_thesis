<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You 💛</title>

<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Lora', serif;
    text-align: center;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    background-size: 300% 300%;
    animation: gradientBG 8s ease infinite;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    max-width: 500px;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    animation: fadeIn 0.8s ease-in-out;
}

h1 {
    margin-bottom: 15px;
}

p {
    font-size: 16px;
    line-height: 1.6;
}

button {
    margin-top: 20px;
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    background-color: #ff4d6d;
    color: white;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.2s ease;
}

button:hover {
    background-color: #e03e5a;
    transform: scale(1.05);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
    <h1>Thank you, <span id="name"></span> 💛</h1>

    <p>
        I genuinely appreciate you taking the time to answer.
    </p>

    <p>
        You’re valued more than you think.
        I hope this year treats you kindly and gives you moments that feel warm and real.
    </p>

    <button onclick="goBack()">Go Back</button>
</div>

<script>
const name = localStorage.getItem("participantName");
document.getElementById("name").textContent = name || "friend";

function goBack() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
